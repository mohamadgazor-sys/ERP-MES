name: CI

# Restore, build and test on Windows (Decision Log #49). No secrets and no deployment. For the demonstration build the
# desktop application is also published self-contained from main only and kept as a 14-day downloadable artifact
# (download only; nothing is deployed).
# Third-party actions are pinned to full commit SHAs; the comment names the release.
# Updating a pinned SHA or the SDK in global.json is a reviewed change.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify the pinned SDK is the one in use
        shell: pwsh
        run: |
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = (dotnet --version).Trim()
          Write-Host "Expected SDK: $expected; actual SDK: $actual"
          if ($actual -ne $expected) { throw "SDK mismatch: expected $expected but dotnet --version reports $actual" }

      - name: Show SDK and runtime information
        run: dotnet --info

      - name: Restore
        run: dotnet restore ERP-MES.sln

      # The pinned EF Core command-line tool (.config/dotnet-tools.json, Decision Log #56). Restored from the manifest only.
      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Verify dotnet-ef is the pinned version
        shell: pwsh
        run: |
          $expected = (Get-Content .config/dotnet-tools.json -Raw | ConvertFrom-Json).tools.'dotnet-ef'.version
          $output = dotnet ef --version | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "dotnet ef failed with exit code $LASTEXITCODE" }
          if ($output -notmatch [regex]::Escape($expected)) { throw "dotnet-ef is not the pinned version $expected" }

      # Dependency graph and advisories, direct and transitive (Decision Log #43, #53).
      # The full listing is kept in the log so it can be recorded in docs/MILESTONE_1_PLAN.md section 8.
      - name: List packages (direct and transitive)
        run: dotnet list ERP-MES.sln package --include-transitive --no-restore

      - name: Check for vulnerable packages (direct and transitive)
        shell: pwsh
        run: |
          $output = dotnet list ERP-MES.sln package --vulnerable --include-transitive --no-restore 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -ne 0) { throw "dotnet list package failed with exit code $exit" }
          if ($output -match 'has the following vulnerable packages') { throw 'Vulnerable packages were found (direct or transitive).' }
          if ($output -notmatch 'no vulnerable packages') { throw 'The vulnerability report did not complete (no "no vulnerable packages" statement found).' }

      - name: Build (Debug)
        run: dotnet build ERP-MES.sln --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build ERP-MES.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test ERP-MES.sln --configuration Release --no-build --logger trx --results-directory TestResults

      # A run that discovers no tests must not be reported as a pass.
      - name: Verify tests were discovered and passed
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'No TRX result files were produced.' }
          $total = 0; $passed = 0; $failed = 0
          foreach ($f in $files) {
            [xml]$x = Get-Content -LiteralPath $f.FullName
            $c = $x.TestRun.ResultSummary.Counters
            Write-Host ("{0}: total={1} executed={2} passed={3} failed={4}" -f $f.Name, $c.total, $c.executed, $c.passed, $c.failed)
            if ([int]$c.total -eq 0) { throw ("Zero tests were discovered in {0}" -f $f.Name) }
            $total += [int]$c.total; $passed += [int]$c.passed; $failed += [int]$c.failed
          }
          Write-Host "TOTAL: files=$($files.Count) total=$total passed=$passed failed=$failed"
          if ($failed -ne 0 -or $passed -ne $total) { throw 'Not all discovered tests passed.' }

      # Runs the real provisioning commands on temporary files (docs/DEMO_SEED_AND_RESET.md, docs/AUTHENTICATION.md). The demonstration accounts' one-time
      # passwords go only to credential files in the runner's temp folder; every password and token read here is registered as a masked value FIRST, and the
      # step fails if any command output contained one. Tokens are captured, never printed.
      - name: Smoke-test the Provisioning commands
        shell: pwsh
        run: |
          $cli = @('run', '--project', 'src/ERP.MES.Provisioning/ERP.MES.Provisioning.csproj', '--configuration', 'Release', '--no-build', '--')
          $demo = Join-Path $env:RUNNER_TEMP 'ci-smoke.demo.db'
          $credentialsOne = Join-Path $env:RUNNER_TEMP 'ci-smoke-1.credentials.txt'
          $credentialsTwo = Join-Path $env:RUNNER_TEMP 'ci-smoke-2.credentials.txt'
          $other = Join-Path $env:RUNNER_TEMP 'ci-smoke-unmarked.txt'
          $production = Join-Path $env:RUNNER_TEMP 'ci-smoke-production.db'

          function Read-Passwords([string] $file) {
            $passwords = @(Get-Content -LiteralPath $file | Where-Object { $_ -like "*`t*" } | ForEach-Object { ($_ -split "`t")[1] })
            foreach ($p in $passwords) { Write-Host "::add-mask::$p" }
            return $passwords
          }
          function Assert-NoSecret([string] $output, [string[]] $secrets) {
            foreach ($s in $secrets) { if ($output.Contains($s)) { throw 'A command printed a secret.' } }
          }

          # Demonstration database: create (credentials only in the protected file), repeat, status.
          $out = & dotnet @cli demo-init $demo --credentials $credentialsOne 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "demo-init failed with exit code $LASTEXITCODE" }
          $first = Read-Passwords $credentialsOne
          if ($first.Count -ne 7 -or ($first | Where-Object { $_.Length -ne 20 })) { throw 'Expected seven 20-character one-time passwords.' }
          if (($first | Select-Object -Unique).Count -ne 7) { throw 'The one-time passwords are not distinct.' }
          Assert-NoSecret $out $first
          Write-Host $out

          $out = & dotnet @cli demo-init $demo --credentials (Join-Path $env:RUNNER_TEMP 'ci-smoke-unused.credentials.txt') 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "a repeated demo-init failed with exit code $LASTEXITCODE" }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'ci-smoke-unused.credentials.txt')) { throw 'A repeated demo-init must not create a credential file.' }
          Assert-NoSecret $out $first
          $status = (& dotnet @cli demo-status $demo | Out-String).Trim()
          if ($status -ne 'Demo') { throw "demo-status reported '$status' instead of 'Demo'" }

          # A credential file inside the repository is refused before anything is changed.
          $inside = Join-Path (Get-Location) 'ci-smoke-inside.credentials.txt'
          & dotnet @cli demo-init (Join-Path $env:RUNNER_TEMP 'ci-smoke-never.demo.db') --credentials $inside 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "A credential file inside the repository must be refused with exit code 1 but exited with $LASTEXITCODE" }
          if ((Test-Path $inside) -or (Test-Path (Join-Path $env:RUNNER_TEMP 'ci-smoke-never.demo.db'))) { throw 'Nothing may be created when the credential file location is refused.' }

          # Reset: needs --yes; gives new accounts with new passwords.
          & dotnet @cli demo-reset $demo --credentials $credentialsTwo 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "demo-reset without --yes must exit with code 2 but exited with $LASTEXITCODE" }
          $out = & dotnet @cli demo-reset $demo --yes --credentials $credentialsTwo 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "demo-reset --yes failed with exit code $LASTEXITCODE" }
          $second = Read-Passwords $credentialsTwo
          if ($second.Count -ne 7) { throw 'Expected seven new one-time passwords after the reset.' }
          if (@($second | Where-Object { $first -contains $_ }).Count -ne 0) { throw 'The reset must create new passwords.' }
          Assert-NoSecret $out ($first + $second)
          Write-Host $out

          # Safe refusal: an unrecognised file is not changed.
          Set-Content -LiteralPath $other -Value 'this is not a demonstration database' -Encoding utf8
          $out = & dotnet @cli demo-reset $other --yes --credentials (Join-Path $env:RUNNER_TEMP 'ci-smoke-refused.credentials.txt') 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1) { throw "demo-reset on an unrecognized file must be refused with exit code 1 but exited with $LASTEXITCODE" }
          if ((Get-Content -LiteralPath $other -Raw).Trim() -ne 'this is not a demonstration database') { throw 'The refused file was changed.' }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'ci-smoke-refused.credentials.txt')) { throw 'A refused reset must not create a credential file.' }
          Write-Host $out

          # Production commands: migrate, bootstrap token (captured and masked, never printed), recovery refused before initialisation.
          & dotnet @cli migrate --database $production
          if ($LASTEXITCODE -ne 0) { throw "migrate failed with exit code $LASTEXITCODE" }
          $tokenOutput = & dotnet @cli issue-admin-token --database $production 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "issue-admin-token failed with exit code $LASTEXITCODE" }
          $match = [regex]::Match($tokenOutput, '[0-9a-f]{8}(-[0-9a-f]{8}){7}')
          if (-not $match.Success) { throw 'issue-admin-token did not print a token of the expected shape.' }
          Write-Host "::add-mask::$($match.Value)"
          Write-Host 'A bootstrap token of the expected shape was issued (not printed).'
          $recovery = & dotnet @cli issue-recovery-token --database $production --username nobody --reason 'smoke test' 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1) { throw "issue-recovery-token before initialisation must be refused with exit code 1 but exited with $LASTEXITCODE" }
          Write-Host $recovery
          $bench = & dotnet @cli benchmark-hash --iterations 310000 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "benchmark-hash failed with exit code $LASTEXITCODE" }
          Write-Host $bench

          Remove-Item -LiteralPath $credentialsOne, $credentialsTwo -Force
          # The last native command above may have exited with a non-zero code on purpose (a refusal); every check has passed.
          exit 0

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # Demonstration build (docs/FOUR_DAY_DEMO_PLAN.md, D1.4). Only on a push to main, and only after the vulnerability
      # check, both builds and all tests above succeeded (a failed step stops the job), so every artifact comes from a
      # merged, fully checked commit. Pull-request runs never publish. Self-contained, so the machine needs no separate
      # .NET install. The RID-specific restore fetches runtime packs; the NuGet vulnerability check above does NOT cover
      # them (they are not package references). Download only: no release, no deployment, no secrets, same permissions.
      - name: Publish demonstration build (self-contained, win-x64)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: dotnet publish src/ERP.MES.Desktop/ERP.MES.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/desktop

      - name: Record the exact commit in the build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $info = @(
            "Commit: ${{ github.sha }}",
            "Run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})",
            "Built (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm'))",
            "Demonstration build: fictional data only, not for production use."
          )
          Set-Content -Path publish/desktop/BUILD-INFO.txt -Value $info -Encoding utf8

      - name: Upload demonstration build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-build-win-x64-${{ github.sha }}
          path: publish/desktop
          if-no-files-found: error
          retention-days: 14
