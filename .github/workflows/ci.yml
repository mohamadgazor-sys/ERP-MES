name: CI

# Restore, build and test on Windows (Decision Log #49). No secrets and no deployment. For the demonstration build the
# desktop application is also published self-contained and kept as a downloadable artifact (download only; nothing is deployed).
# Third-party actions are pinned to full commit SHAs; the comment names the release.
# Updating a pinned SHA or the SDK in global.json is a reviewed change.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify the pinned SDK is the one in use
        shell: pwsh
        run: |
          $expected = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = (dotnet --version).Trim()
          Write-Host "Expected SDK: $expected; actual SDK: $actual"
          if ($actual -ne $expected) { throw "SDK mismatch: expected $expected but dotnet --version reports $actual" }

      - name: Show SDK and runtime information
        run: dotnet --info

      - name: Restore
        run: dotnet restore ERP-MES.sln

      # Dependency graph and advisories, direct and transitive (Decision Log #43, #53).
      # The full listing is kept in the log so it can be recorded in docs/MILESTONE_1_PLAN.md section 8.
      - name: List packages (direct and transitive)
        run: dotnet list ERP-MES.sln package --include-transitive --no-restore

      - name: Check for vulnerable packages (direct and transitive)
        shell: pwsh
        run: |
          $output = dotnet list ERP-MES.sln package --vulnerable --include-transitive --no-restore 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -ne 0) { throw "dotnet list package failed with exit code $exit" }
          if ($output -match 'has the following vulnerable packages') { throw 'Vulnerable packages were found (direct or transitive).' }
          if ($output -notmatch 'no vulnerable packages') { throw 'The vulnerability report did not complete (no "no vulnerable packages" statement found).' }

      - name: Build (Debug)
        run: dotnet build ERP-MES.sln --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build ERP-MES.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test ERP-MES.sln --configuration Release --no-build --logger trx --results-directory TestResults

      # A run that discovers no tests must not be reported as a pass.
      - name: Verify tests were discovered and passed
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'No TRX result files were produced.' }
          $total = 0; $passed = 0; $failed = 0
          foreach ($f in $files) {
            [xml]$x = Get-Content -LiteralPath $f.FullName
            $c = $x.TestRun.ResultSummary.Counters
            Write-Host ("{0}: total={1} executed={2} passed={3} failed={4}" -f $f.Name, $c.total, $c.executed, $c.passed, $c.failed)
            if ([int]$c.total -eq 0) { throw ("Zero tests were discovered in {0}" -f $f.Name) }
            $total += [int]$c.total; $passed += [int]$c.passed; $failed += [int]$c.failed
          }
          Write-Host "TOTAL: files=$($files.Count) total=$total passed=$passed failed=$failed"
          if ($failed -ne 0 -or $passed -ne $total) { throw 'Not all discovered tests passed.' }

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # Demonstration build (docs/FOUR_DAY_DEMO_PLAN.md, D1.4): lets the owner download and run the application, since
      # CI cannot show how the screens look. Self-contained so the machine needs no separate .NET install. This restore
      # also fetches the runtime packs, which the vulnerability gate above does not cover (they are not package references).
      - name: Publish demonstration build (self-contained, win-x64)
        run: dotnet publish src/ERP.MES.Desktop/ERP.MES.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/desktop

      - name: Upload demonstration build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-build-win-x64
          path: publish/desktop
          if-no-files-found: error
          retention-days: 14
