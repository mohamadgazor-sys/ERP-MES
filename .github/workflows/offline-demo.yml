name: Offline demo package

# Builds the offline Windows demo package (tools/offline-demo, docs/OFFLINE_DEMO_GUIDE.md), then proves it from the ZIP alone: checksums, no .NET available on the machine, outbound traffic of the
# package programs blocked, launcher + database creation + UI automation with all ten accounts + reset. Runs on the current Windows runner image and on Windows Server 2022 (an older, officially
# supported kernel). Nothing is deployed and there are no secrets. The ZIP is uploaded as a workflow artifact only for a push to main or a manual run.
# Third-party actions are pinned to full commit SHAs; the comment names the release.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the package
        shell: pwsh
        run: |
          $version = (Get-Date -Format 'yyyy.MM.dd') + '-' + $env:GITHUB_SHA.Substring(0, 7)
          ./tools/offline-demo/Build-OfflineDemo.ps1 -Version $version -OutDir "$env:RUNNER_TEMP/out"
          $zip = Get-ChildItem "$env:RUNNER_TEMP/out" -Filter '*.zip' | Select-Object -First 1
          "ZIP_PATH=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$($zip.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content "$($zip.FullName).sha256"
          Get-Content "$env:RUNNER_TEMP/out/*/MANIFEST.txt"

      - name: Prove the package offline (from the ZIP only)
        shell: pwsh
        run: ./tools/offline-demo/Test-OfflinePackage.ps1 -ZipPath $env:ZIP_PATH

      - name: Print selected screenshots (fictional data) into the log
        if: ${{ always() }}
        shell: pwsh
        run: ./tools/ui-smoke/Print-Screenshots.ps1 -Names 'demo.supervisor-1-signin','demo.supervisor-6','demo.planning-28','demo.secretary-49'

      - name: Upload the offline package
        if: ${{ matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erp-mes-offline-demo
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.ZIP_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30
